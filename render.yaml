services:
  - type: web
    name: caduceu
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.supplies.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caduceu-db
          property: connectionString

databases:
  - name: caduceu-db
    plan: free
